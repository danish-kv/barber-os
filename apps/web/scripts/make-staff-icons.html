<!doctype html>
<!-- Staff PWA icon source. Rendered to PNG by scripts/make-staff-icons.sh
     via headless Chrome. Visual language mirrors the existing Royal Cuts
     mark (charcoal ground, gold stroke) so the staff app reads as part of
     the same family without impersonating the shop brand. -->
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 512px; height: 512px;
    background: radial-gradient(120% 120% at 30% 20%, #2b221a 0%, #211a13 55%, #171208 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .ring {
    position: absolute; inset: 13%;
    border: 10px solid #8a6a33;
    border-radius: 50%;
  }
  /* maskable variant: glyph shrunk into the 80% safe zone, no ring */
  .maskable .ring { display: none; }
  .maskable svg { width: 46%; height: 46%; }
  svg { width: 52%; height: 52%; }
</style>
</head>
<body>
<div class="icon" id="mark">
  <span class="ring"></span>
  <!-- lucide "scissors", stroke-based -->
  <svg viewBox="0 0 24 24" fill="none" stroke="#e8c987" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3"/>
    <path d="M8.12 8.12 12 12"/>
    <path d="M20 4 8.12 15.88"/>
    <circle cx="6" cy="18" r="3"/>
    <path d="M14.8 14.8 20 20"/>
  </svg>
</div>
<script>
  if (location.hash === "#maskable") {
    document.getElementById("mark").classList.add("maskable");
  }
</script>
</body>
</html>
